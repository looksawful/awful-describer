name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and unit tests
        run: npm run check

      - name: Production build
        run: npm run build
